<!DOCTYPE html>
<html>
<head>
  <title>TrackHire Settings</title>
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
      margin: 0;
      color: #111827;
      background-color: #f9fafb;
    }
    h2 {
      margin-top: 0;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #374151;
    }
    input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #D1D5DB;
      border-radius: 6px;
      font-size: 13px;
      box-sizing: border-box;
      outline: none;
    }
    input:focus {
      border-color: #005F4B;
      box-shadow: 0 0 0 2px rgba(0, 95, 75, 0.2);
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #005F4B;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #004D3C;
    }
    #status {
      margin-top: 12px;
      font-size: 13px;
      text-align: center;
      min-height: 18px;
    }
    .success { color: #059669; }
    .error { color: #DC2626; }
    
    .help-text {
      font-size: 12px;
      color: #6B7280;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <h2>TrackHire Clipper</h2>
  
  <div class="form-group">
    <label for="apiUrl">TrackHire App URL</label>
    <input type="text" id="apiUrl" placeholder="http://localhost:3000">
    <div class="help-text">Your hosted URL or localhost for dev.</div>
  </div>

  <div class="form-group">
    <label for="apiKey">API Key</label>
    <input type="password" id="apiKey" placeholder="th_...">
    <div class="help-text">Generate this in TrackHire Settings.</div>
  </div>

  <button id="saveBtn">Save Configuration</button>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
